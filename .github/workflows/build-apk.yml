
name: Build HotBetAnalyzer v0.9 APK

on:
  workflow_dispatch:
  push:
    branches: [main, master, v0.8-test, v0.9-test]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK from repository source
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean assembleDebug

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk \
          app/build/outputs/apk/debug/HotBetAnalyzer-v0.9.0-S23Ultra-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HotBetAnalyzer-v0.9.0-S23Ultra-debug-apk
          path: app/build/outputs/apk/debug/HotBetAnalyzer-v0.9.0-S23Ultra-debug.apk
          if-no-files-found: error
          retention-days: 14
