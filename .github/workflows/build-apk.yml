name: Build HotBetAnalyzer v0.9.5

on:
  workflow_dispatch:

  push:
    branches:
      - New_branch

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK platform
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: hotbet-debug-signing-key-v1

      - name: Create stable debug signing key if missing
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" \
              -noprompt
          fi

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check project files
        run: |
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/hotbet/analyzer/MainActivity.kt
          test -f app/src/main/java/com/hotbet/analyzer/CaptureService.kt
          test -f app/src/main/java/com/hotbet/analyzer/PredictionEngine.kt

      - name: Build APK v0.9.5
        run: |
          gradle --no-daemon clean assembleDebug

      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"
          unzip -t "$APK"

          "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            dump badging "$APK"

          mkdir -p release

          cp "$APK" \
            release/HotBetAnalyzer-v0.9.5-S23Ultra-debug.apk

          sha256sum \
            release/HotBetAnalyzer-v0.9.5-S23Ultra-debug.apk \
            > release/SHA256SUMS.txt

          ls -lh release/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HotBetAnalyzer-v0.9.5-NewBranch-APK
          path: release/*
          if-no-files-found: error
          retention-days: 30
