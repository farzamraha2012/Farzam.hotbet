
name: Build HotBetAnalyzer v0.9 APK

on:
  workflow_dispatch:
  push:
    branches: [main, master, v0.8-test, v0.9-test]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract v0.9 source ZIP
        run: |
          mkdir -p source-v09
          unzip -q HotBetAnalyzer-v0.9.0-analytics-source.zip -d source-v09
          test -f source-v09/settings.gradle.kts
          test -f source-v09/app/build.gradle.kts
          test -f source-v09/app/src/main/java/com/hotbet/analyzer/AnalyticsEngine.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Gradle wrapper
        working-directory: source-v09
        run: gradle wrapper --gradle-version 8.9 --distribution-type bin

      - name: Build v0.9 debug APK
        working-directory: source-v09
        run: bash ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: |
          cp source-v09/app/build/outputs/apk/debug/app-debug.apk \
            source-v09/app/build/outputs/apk/debug/HotBetAnalyzer-v0.9.0-S23Ultra-debug.apk

      - name: Upload v0.9 APK
        uses: actions/upload-artifact@v4
        with:
          name: HotBetAnalyzer-v0.9.0-S23Ultra-debug-apk
          path: source-v09/app/build/outputs/apk/debug/HotBetAnalyzer-v0.9.0-S23Ultra-debug.apk
          if-no-files-found: error
          retention-days: 14
