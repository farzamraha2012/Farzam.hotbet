
name: Build HotBetAnalyzer v0.9.3

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - v0.8-test
      - v0.9-test

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK platform
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          gradle --no-daemon clean assembleDebug

      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          echo "Checking APK archive..."
          unzip -t "$APK"

          echo "Checking Android package..."
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK"

          mkdir -p release

          cp "$APK" release/HotBetAnalyzer-v0.9.3-S23Ultra-debug.apk

          echo "Calculating SHA256..."
          sha256sum release/HotBetAnalyzer-v0.9.3-S23Ultra-debug.apk \
            > release/SHA256SUMS.txt

          ls -lh release/

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: HotBetAnalyzer-v0.9.3-backup
          path: release/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.9.3
          name: HotBetAnalyzer v0.9.3
          body: |
            HotBetAnalyzer v0.9.3

            Android debug APK for Samsung Galaxy S23 Ultra.

            The APK was checked before publication.
            SHA256 checksum is included.
          files: |
            release/HotBetAnalyzer-v0.9.3-S23Ultra-debug.apk
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: true
